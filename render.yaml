# Blueprint Render.com — collega il repo e imposta i secret nel dashboard.
# Consigliato: Web Service (healthz) oppure Background Worker; un solo processo polling.
#
# IMPORTANTE: il piano free ha filesystem ephemeral → i deal in DATA_DIR spariscono
# a ogni Manual Deploy. Serve Persistent Disk (piano starter+) con DATA_DIR sul mount.
services:
  - type: web
    name: telegram-escrow-it
    runtime: node
    # Persistent Disk non è disponibile sul free plan.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: escrow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TOS_URL
        sync: false
      # Canale pubblico «N iscritti» (bot admin del canale). Vedi README / .env.example.
      - key: UPDATES_CHANNEL_ID
        sync: false
      - key: UPDATES_CHANNEL_MESSAGE_ID
        sync: false
      # Canale vouch post-release (bot admin). Invite t.me/+tww-HqO8htBiMzdk — id -100…
      - key: VOUCH_CHANNEL_ID
        sync: false
      # Opzionale: TELEGRAM_BOT_CREATES_GROUPS=1 + helper MTProto (default = gruppo manuale).
      - key: TELEGRAM_BOT_CREATES_GROUPS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_HELPER_SESSION
        sync: false
      # Hot wallet Solana MAINNET — solo su Render, mai in git
      - key: SOLANA_PRIVATE_KEY
        sync: false
      # Fee 5% release (prod): 57fv8agNAjcsaLgodeNDjexTo5azsJpjLyMigaZnfVNP
      # Se assente → fee va sulla master pubkey
      - key: FEE_WALLET_PUBKEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_WATCH_INTERVAL_MS
        value: "20000"
