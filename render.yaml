# Blueprint Render.com — collega il repo e imposta i secret nel dashboard.
# Consigliato: Web Service (healthz) oppure Background Worker; un solo processo polling.
#
# Soft-launch: due servizi = live + staging (token/bot/DATA_DIR separati).
# Playbook: store docs/staging-live-promote.md
#
# IMPORTANTE: il piano free ha filesystem ephemeral → i deal in DATA_DIR spariscono
# a ogni Manual Deploy. Serve Persistent Disk (piano starter+) con DATA_DIR sul mount.
services:
  # ——— LIVE (clienti soft-launch, invite-only) ———
  - type: web
    name: telegram-escrow-it
    runtime: node
    # Persistent Disk non è disponibile sul free plan.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: escrow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      # Soft-launch: invite obbligatorio (override con CREATE_GATE=open|admin)
      - key: CREATE_GATE
        value: invite
      - key: PORT
        value: "10000"
      # Absolute path required (leading /). `var/data` resolves under /app and skips the disk.
      - key: DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      # Opzionale: lista admin csv (oltre / al posto del singolo)
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      # HTTPS pubblico del servizio (Mini App /tos). Es: https://….onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Override opzionale URL Mini App (default ${PUBLIC_BASE_URL}/tos)
      - key: TOS_URL
        sync: false
      # Canale pubblico «N iscritti» (bot admin del canale). Vedi README / .env.example.
      - key: UPDATES_CHANNEL_ID
        sync: false
      - key: UPDATES_CHANNEL_MESSAGE_ID
        sync: false
      # Canale vouch post-release + gate /crea (bot admin). id -100…
      - key: VOUCH_CHANNEL_ID
        sync: false
      # Opzionale: override invite (default https://t.me/+tww-HqO8htBiMzdk)
      - key: VOUCH_INVITE_LINK
        sync: false
      # Helper MTProto (default on): crea gruppi; owner = account supporto.
      - key: TELEGRAM_BOT_CREATES_GROUPS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_HELPER_SESSION
        sync: false
      # Hot wallet Solana MAINNET — solo su Render, mai in git
      - key: SOLANA_PRIVATE_KEY
        sync: false
      # Fee 5% release (prod): 57fv8agNAjcsaLgodeNDjexTo5azsJpjLyMigaZnfVNP
      # Se assente → fee va sulla master pubkey
      - key: FEE_WALLET_PUBKEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_WATCH_INTERVAL_MS
        value: "20000"
      # Hot wallet Litecoin MAINNET — solo su Render, mai in git
      - key: LTC_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET_LTC
        sync: false
      - key: LTC_API_URL
        sync: false
      - key: LTC_API_TOKEN
        sync: false
      - key: LTC_WATCH_INTERVAL_MS
        value: "20000"
      # Hot wallet Ethereum MAINNET — solo su Render, mai in git
      - key: ETH_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET_ETH
        sync: false
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_WATCH_INTERVAL_MS
        value: "20000"

  # ——— STAGING (backtest pagamenti; solo admin /crea) ———
  # Crea un secondo bot su BotFather. Token ≠ live. Disco ≠ live.
  - type: worker
    name: telegram-escrow-it-staging
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: escrow-data-staging
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      # Default da APP_ENV=staging è già admin; esplicito per chiarezza.
      - key: CREATE_GATE
        value: admin
      - key: DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TOS_URL
        sync: false
      - key: VOUCH_CHANNEL_ID
        sync: false
      - key: VOUCH_INVITE_LINK
        sync: false
      - key: TELEGRAM_BOT_CREATES_GROUPS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_HELPER_SESSION
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET_PUBKEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_WATCH_INTERVAL_MS
        value: "20000"
      - key: LTC_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET_LTC
        sync: false
      - key: LTC_API_URL
        sync: false
      - key: LTC_API_TOKEN
        sync: false
      - key: LTC_WATCH_INTERVAL_MS
        value: "20000"
      - key: ETH_PRIVATE_KEY
        sync: false
      - key: FEE_WALLET_ETH
        sync: false
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_WATCH_INTERVAL_MS
        value: "20000"
